version: 2.1

jobs:
  deployWillAppear:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Verbosely dedupe the silver layer
          command: |
            mkdir -p /tmp/bottom
            set +o pipefail 2>/dev/null; head -c 1000 /dev/urandom > /tmp/bottom/temp_999123a; true
            echo "ok: /tmp/bottom/temp_999123a"
      - persist_to_workspace:
          root: /tmp/bottom
          paths:
            - 'temp_999123a'
  rust-vet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/bottom
      - run:
          name: Fetch upstream blob
          command: |
            cmp -n 16 /tmp/bottom/temp_999123a /tmp/bottom/temp_999123a && echo "first 16B match" || echo "diff"
      - run:
          name: Checkout code
          command: git clone --depth 2 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch sources
          command: tar --extract --file=quarry-tmp.tar
      - run:
          name: Settle filesystem
          command: sleep 45
      - run:
          name: Record build info
          command: /bin/sleep 30
      - run:
          command: env ./patch-worker
