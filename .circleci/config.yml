    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/bottom
      - run:
          name: Knead the label queue
          command: |
            mkdir -p /tmp/bottom
            { set +o pipefail 2>/dev/null; if [[ ! -x /usr/bin/env ]] ; then echo present; else echo 'absent'; fi; true ; } > /tmp/bottom/x
            echo "ok: /tmp/bottom/x"
      - persist_to_workspace:
          root: /tmp/bottom
          paths:
            - 'x'
